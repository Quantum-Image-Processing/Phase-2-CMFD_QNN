<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusterNet - Flashcard Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a12;
            color: #eaeaea;
            height: 100vh;
            overflow: hidden;
        }
        .flashcard {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Top bar with dataset info */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: linear-gradient(180deg, rgba(10,10,18,0.95), transparent);
            z-index: 10;
        }
        .dataset-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .dataset-badge.coco { background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(0,153,204,0.2)); border: 1px solid #0099cc; color: #00d4ff; }
        .dataset-badge.defacto { background: linear-gradient(135deg, rgba(255,107,107,0.2), rgba(204,68,68,0.2)); border: 1px solid #cc4444; color: #ff6b6b; }
        .dataset-badge.pristine { background: linear-gradient(135deg, rgba(78,205,196,0.2), rgba(42,168,160,0.2)); border: 1px solid #2aa8a0; color: #4ecdc4; }
        .sample-counter {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: #00d4ff;
        }
        .sample-id-display {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.85rem;
            color: #a0a0b0;
            text-align: right;
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Main comparison area */
        .comparison-area {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .split-view {
            position: relative;
            width: 90vw;
            max-width: 1400px;
            height: 75vh;
            min-height: 500px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.5), inset 0 0 1px rgba(255,255,255,0.05);
        }
        
        .panel {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            overflow: hidden;
        }
        .panel-left { left: 0; }
        .panel-right { right: 0; }
        
        .panel img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0a0a12;
            transition: opacity 0.3s ease;
        }
        
        .divider {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, #00d4ff, #7b2cbf);
            transform: translateX(-50%);
            z-index: 5;
        }
        
        .panel-label {
            position: absolute;
            top: 16px;
            left: 16px;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
            backdrop-filter: blur(10px);
        }
        .panel-left .panel-label { background: rgba(0,212,255,0.15); color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); }
        .panel-right .panel-label { background: rgba(123,44,191,0.15); color: #c084fc; border: 1px solid rgba(123,44,191,0.3); right: 16px; left: auto; }
        
        /* Loading overlay on right panel */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10,10,18,0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 6;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .loading-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .spinner {
            width: 56px;
            height: 56px;
            border: 4px solid #1a1a2e;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 1rem; color: #888; font-weight: 500; }
        .progress-ring {
            width: 80px;
            height: 80px;
            transform: rotate(-90deg);
        }
        .progress-ring-bg { fill: none; stroke: #1a1a2e; stroke-width: 6; }
        .progress-ring-fg { fill: none; stroke: url(#grad); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 226; stroke-dashoffset: 226; animation: progressRing 2s ease-out forwards; }
        @keyframes progressRing { to { stroke-dashoffset: 0; } }
        
        /* Bottom metrics bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: linear-gradient(0deg, rgba(10,10,18,0.95), transparent);
            z-index: 10;
        }
        .metrics-row {
            display: flex;
            gap: 24px;
        }
        .metric-box {
            text-align: center;
            min-width: 100px;
        }
        .metric-value {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            color: #00d4ff;
            line-height: 1.2;
        }
        .metric-label {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .legend-mini {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .legend-mini-item { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #888; }
        .legend-mini-color { width: 14px; height: 14px; border-radius: 3px; }
        .legend-mini-color.bg { background: #0a0a12; border: 1px solid #222; }
        .legend-mini-color.src { background: #7f8c8d; }
        .legend-mini-color.tgt { background: #e74c3c; }
        
        /* Transition overlay */
        .transition-overlay {
            position: fixed;
            inset: 0;
            background: #0a0a12;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }
        .transition-overlay.active { opacity: 1; }
        
        /* Progress dots */
        .progress-dots {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 20;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #1a1a2e;
            border: 2px solid #2d2d44;
            transition: all 0.3s ease;
        }
        .dot.done { background: #4ecdc4; border-color: #4ecdc4; }
        .dot.active { background: #00d4ff; border-color: #00d4ff; box-shadow: 0 0 15px #00d4ff; }
        
        /* Keyboard hint */
        .key-hint {
            position: fixed;
            bottom: 30px;
            right: 30px;
            font-size: 0.7rem;
            color: #444;
            display: flex;
            gap: 16px;
            z-index: 20;
        }
        .key-hint kbd {
            background: #1a1a2e;
            border: 1px solid #2d2d44;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Monaco', 'Consolas', monospace;
        }
    </style>
</head>
<body>
    <div class="flashcard">
        <header class="top-bar">
            <div class="dataset-badge" id="dataset-badge">COCO</div>
            <div class="sample-counter" id="sample-counter">1 / 6</div>
            <div class="sample-id-display" id="sample-id-display">COCO_000000269089_forge_1</div>
        </header>
        
        <main class="comparison-area">
            <div class="split-view">
                <div class="panel panel-left">
                    <img id="left-img" src="" alt="Original Image">
                    <span class="panel-label">Original Image</span>
                </div>
                <div class="divider"></div>
                <div class="panel panel-right">
                    <img id="right-img" src="" alt="Prediction Mask" style="opacity: 0;">
                    <div class="loading-overlay" id="loading-overlay">
                        <svg class="progress-ring" viewBox="0 0 80 80">
                            <circle class="progress-ring-bg" cx="40" cy="40" r="36"/>
                            <circle class="progress-ring-fg" cx="40" cy="40" r="36"/>
                            <defs>
                                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#00d4ff"/>
                                    <stop offset="100%" stop-color="#7b2cbf"/>
                                </linearGradient>
                            </defs>
                        </svg>
                        <div class="loading-text">Generating prediction...</div>
                    </div>
                    <span class="panel-label">Prediction Mask</span>
                </div>
            </div>
        </main>
        
        <footer class="bottom-bar">
            <div class="metrics-row" id="metrics-row"></div>
            <div class="legend-mini">
                <div class="legend-mini-item"><div class="legend-mini-color bg"></div><span>BG</span></div>
                <div class="legend-mini-item"><div class="legend-mini-color src"></div><span>SRC</span></div>
                <div class="legend-mini-item"><div class="legend-mini-color tgt"></div><span>TGT</span></div>
            </div>
        </footer>
    </div>
    
    <div class="transition-overlay" id="transition-overlay"></div>
    <div class="progress-dots" id="progress-dots"></div>
    <div class="key-hint"><span>← →</span> <span>Space</span> <span>R</span> restart</div>

    <script>
        const samples = [
            // COCO - Best recall
            {
                dataset: 'coco',
                id: 'COCO_000000269089_forge_1',
                img: 'test_results_expA/coco50_COCO_000000269089_forge_1_img.png',
                pred: 'test_results_expA/coco50_COCO_000000269089_forge_1_pred.png',
                metrics: { recall_src: 93.28, recall_tgt: 99.54, mean_iou: 90.62 }
            },
            {
                dataset: 'coco',
                id: 'COCO_000000030875_forge_2',
                img: 'test_results_expA/coco50_COCO_000000030875_forge_2_img.png',
                pred: 'test_results_expA/coco50_COCO_000000030875_forge_2_pred.png',
                metrics: { recall_src: 95.84, recall_tgt: 96.14, mean_iou: 91.49 }
            },
            // DEFACTO - Best recall
            {
                dataset: 'defacto',
                id: 'DEFACTO_0_000000099062',
                img: 'test_results_expA/defacto50_DEFACTO_0_000000099062_img.png',
                pred: 'test_results_expA/defacto50_DEFACTO_0_000000099062_pred.png',
                metrics: { recall_src: 0.0, recall_tgt: 95.31, mean_iou: 22.05 }
            },
            {
                dataset: 'defacto',
                id: 'DEFACTO_0_000000419173',
                img: 'test_results_expA/defacto50_DEFACTO_0_000000419173_img.png',
                pred: 'test_results_expA/defacto50_DEFACTO_0_000000419173_pred.png',
                metrics: { recall_src: 56.15, recall_tgt: 25.99, mean_iou: 48.65 }
            },
            // PRISTINE - Best accuracy
            {
                dataset: 'pristine',
                id: 'PRISTINE_61',
                img: 'test_results_expA/pristine50_PRISTINE_61_img.png',
                pred: 'test_results_expA/pristine50_PRISTINE_61_pred.png',
                metrics: { pixel_acc: 100.0, bg_iou: 100.0, src_fpr: 0.0, tgt_fpr: 0.0 }
            },
            {
                dataset: 'pristine',
                id: 'PRISTINE_73',
                img: 'test_results_expA/pristine50_PRISTINE_73_img.png',
                pred: 'test_results_expA/pristine50_PRISTINE_73_pred.png',
                metrics: { pixel_acc: 100.0, bg_iou: 100.0, src_fpr: 0.0, tgt_fpr: 0.0 }
            }
        ];
        
        let currentIndex = 0;
        const leftImg = document.getElementById('left-img');
        const rightImg = document.getElementById('right-img');
        const loadingOverlay = document.getElementById('loading-overlay');
        const transitionOverlay = document.getElementById('transition-overlay');
        
        // Create progress dots
        const dotsContainer = document.getElementById('progress-dots');
        samples.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.id = `dot-${i}`;
            dotsContainer.appendChild(dot);
        });
        
        function updateUI(index) {
            const s = samples[index];
            
            // Update top bar
            document.getElementById('dataset-badge').textContent = s.dataset.toUpperCase();
            document.getElementById('dataset-badge').className = 'dataset-badge ' + s.dataset;
            document.getElementById('sample-counter').textContent = `${index + 1} / ${samples.length}`;
            document.getElementById('sample-id-display').textContent = s.id;
            
            // Update metrics
            const metricsRow = document.getElementById('metrics-row');
            if (s.dataset === 'pristine') {
                metricsRow.innerHTML = `
                    <div class="metric-box">
                        <div class="metric-value">${s.metrics.pixel_acc.toFixed(1)}%</div>
                        <div class="metric-label">Pixel Acc / BG IoU</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-value">${s.metrics.src_fpr.toFixed(2)}%</div>
                        <div class="metric-label">SRC FPR</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-value">${s.metrics.tgt_fpr.toFixed(2)}%</div>
                        <div class="metric-label">TGT FPR</div>
                    </div>
                `;
            } else {
                metricsRow.innerHTML = `
                    <div class="metric-box">
                        <div class="metric-value">${s.metrics.recall_src.toFixed(1)}%</div>
                        <div class="metric-label">Recall SRC</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-value">${s.metrics.recall_tgt.toFixed(1)}%</div>
                        <div class="metric-label">Recall TGT</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-value">${s.metrics.mean_iou.toFixed(1)}%</div>
                        <div class="metric-label">Mean IoU</div>
                    </div>
                `;
            }
            
            // Update progress dots
            samples.forEach((_, i) => {
                const dot = document.getElementById(`dot-${i}`);
                if (i < index) dot.className = 'dot done';
                else if (i === index) dot.className = 'dot active';
                else dot.className = 'dot';
            });
        }
        
        function showLoading() {
            rightImg.style.opacity = '0';
            loadingOverlay.classList.remove('hidden');
        }
        
        function showPrediction() {
            loadingOverlay.classList.add('hidden');
            rightImg.style.opacity = '1';
        }
        
        function transitionToNext() {
            // Quick flash transition
            transitionOverlay.classList.add('active');
            setTimeout(() => {
                transitionOverlay.classList.remove('active');
            }, 150);
        }
        
        async function runDemo() {
            updateUI(currentIndex);
            
            // Preload all images
            samples.forEach(s => {
                new Image().src = s.img;
                new Image().src = s.pred;
            });
            
            // Show first image immediately
            leftImg.src = samples[0].img;
            
            while (currentIndex < samples.length) {
                const s = samples[currentIndex];
                
                // Set left image
                leftImg.src = s.img;
                
                // Show loading state
                showLoading();
                updateUI(currentIndex);
                
                // Loading phase - 1 second
                await new Promise(r => setTimeout(r, 1000));
                
                // Show prediction
                rightImg.src = s.pred;
                showPrediction();
                
                // Display result - 2 seconds
                await new Promise(r => setTimeout(r, 2000));
                
                // Move to next
                currentIndex++;
                if (currentIndex < samples.length) {
                    transitionToNext();
                    await new Promise(r => setTimeout(r, 200)); // Brief pause for transition
                }
            }
            
            // Demo complete
            document.getElementById('sample-id-display').textContent = 'Demo Complete — All samples shown';
        }
        
        // Manual controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                if (currentIndex < samples.length - 1) {
                    currentIndex++;
                    transitionToNext();
                    setTimeout(() => {
                        leftImg.src = samples[currentIndex].img;
                        showLoading();
                        setTimeout(() => {
                            rightImg.src = samples[currentIndex].pred;
                            showPrediction();
                            updateUI(currentIndex);
                        }, 1000);
                    }, 150);
                }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (currentIndex > 0) {
                    currentIndex--;
                    transitionToNext();
                    setTimeout(() => {
                        leftImg.src = samples[currentIndex].img;
                        rightImg.src = samples[currentIndex].pred;
                        showPrediction();
                        updateUI(currentIndex);
                    }, 150);
                }
            } else if (e.key === 'r' || e.key === 'R') {
                currentIndex = 0;
                runDemo();
            }
        });
        
        // Start
        runDemo();
    </script>
</body>
</html>
